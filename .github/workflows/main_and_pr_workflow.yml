name: Main and pull request checks
on:
  push:
    branches: [ 'main', 'version.*' ]
  pull_request:
    branches: [ 'main', 'version.*' ]
jobs:
  assemble:
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 25]
        runs-on: [ubuntu-latest]
    name: Assemble on ${{ matrix.runs-on }} with JDK ${{ matrix.java-version }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: gradle
      - name: Assemble with Gradle
        run: ./gradlew assemble

  check:
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { opensearch-version: 2.19.2, java-version: 21 }
          - { opensearch-version: 2.19.2, java-version: 25 }
          - { opensearch-version: 3.0.0,  java-version: 21 }
          - { opensearch-version: 3.0.0,  java-version: 25 }
          - { opensearch-version: 3.5.0,  java-version: 21 }
          - { opensearch-version: 3.5.0,  java-version: 25 }
          - { opensearch-version: 3.7.0,  java-version: 21 }
          - { opensearch-version: 3.7.0,  java-version: 25 }
        runs-on: [ubuntu-latest]
    name: Check on ${{ matrix.runs-on }} with JDK ${{ matrix.entry.java-version }} against OpenSearch ${{ matrix.entry.opensearch-version }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up JDK ${{ matrix.entry.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v3
        with:
          java-version: ${{ matrix.entry.java-version }}
          distribution: 'temurin'
          cache: gradle
      - name: Check with Gradle
        run: ./gradlew check -Psde.testcontainers.image-version=${{ matrix.entry.opensearch-version }}

  check-native-image:
    name: Check that Spring AOT and GraalVM native image work by compiling the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1
        with:
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build example as native image
        run: ./gradlew :spring-data-opensearch-examples:spring-boot-java-client-gradle:nativeCompile
